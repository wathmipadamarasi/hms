<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HMS - Medical Records</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; }
        .navbar { background: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; }
        .content { padding: 30px; max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; }
        input, select, textarea { padding: 8px; margin: 5px 5px 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 16px; background: #2c7be5; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>HMS - Medical Records</h2>
        <a href="/dashboard">Back to Dashboard</a>
    </div>
    <div class="content">
        <div class="card">
            <h3>Add Medical Record</h3>
            <form th:action="@{/medical-records-page/add}" method="post">
                <select name="patientId" required>
                    <option value="">-- Select Patient --</option>
                    <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name}"></option>
                </select>
                <select name="doctorId" required>
                    <option value="">-- Select Doctor --</option>
                    <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.name}"></option>
                </select><br>
                <input type="text" name="diagnosis" placeholder="Diagnosis" required>
                <input type="text" name="prescription" placeholder="Prescription"><br>
                <textarea name="notes" placeholder="Notes"></textarea><br>
                <button type="submit">Add Record</button>
            </form>
        </div>
        <div class="card">
            <h3>All Medical Records</h3>
            <table>
                <tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Diagnosis</th><th>Prescription</th><th>Date</th></tr>
                <tr th:each="r : ${records}">
                    <td th:text="${r.id}"></td>
                    <td th:text="${r.patient.name}"></td>
                    <td th:text="${r.doctor.name}"></td>
                    <td th:text="${r.diagnosis}"></td>
                    <td th:text="${r.prescription}"></td>
                    <td th:text="${r.recordDate}"></td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
