<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HMS - Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; }
        .navbar { background: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .content { padding: 30px; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>HMS Dashboard</h2>
        <span>Welcome<span th:if="${user != null}">, <span th:text="${user.fullName}"></span> (<span th:text="${user.role}"></span>)</span></span>
    </div>
    <div class="content">
        <div class="card"><a href="/patients-page">Manage Patients</a></div>
        <div class="card"><a href="/doctors-page">Manage Doctors</a></div>
        <div class="card"><a href="/appointments-page">Manage Appointments</a></div>
        <div class="card"><a href="/billing-page">Manage Billing</a></div>
        <div class="card"><a href="/medical-records-page">Medical Records</a></div>
        <div class="card"><a href="/lab-tests-page">Lab Tests</a></div>
        <div class="card"><a href="/medicines-page">Pharmacy</a></div>
        <div class="card"><a href="/staff-page">Staff Management</a></div>
    </div>
</body>
</html>
