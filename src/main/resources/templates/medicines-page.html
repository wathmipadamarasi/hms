<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HMS - Pharmacy</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; }
        .navbar { background: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; }
        .content { padding: 30px; max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; }
        input { padding: 8px; margin: 5px 5px 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 16px; background: #2c7be5; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>HMS - Pharmacy</h2>
        <a href="/dashboard">Back to Dashboard</a>
    </div>
    <div class="content">
        <div class="card">
            <h3>Add Medicine</h3>
            <form th:action="@{/medicines-page/add}" method="post">
                <input type="text" name="name" placeholder="Medicine Name" required>
                <input type="number" name="quantity" placeholder="Quantity" required>
                <input type="number" name="price" placeholder="Price" step="0.01" required>
                <input type="date" name="expiryDate" required><br>
                <button type="submit">Add Medicine</button>
            </form>
        </div>
        <div class="card">
            <h3>All Medicines</h3>
            <table>
                <tr><th>ID</th><th>Name</th><th>Quantity</th><th>Price</th><th>Expiry</th></tr>
                <tr th:each="m : ${medicines}">
                    <td th:text="${m.id}"></td>
                    <td th:text="${m.name}"></td>
                    <td th:text="${m.quantity}"></td>
                    <td th:text="${m.price}"></td>
                    <td th:text="${m.expiryDate}"></td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
