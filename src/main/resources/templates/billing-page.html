<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HMS - Billing</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; }
        .navbar { background: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; }
        .content { padding: 30px; max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; }
        input, select { padding: 8px; margin: 5px 5px 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 16px; background: #2c7be5; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>HMS - Billing</h2>
        <a href="/dashboard">Back to Dashboard</a>
    </div>
    <div class="content">
        <div class="card">
            <h3>Generate Bill</h3>
            <form th:action="@{/billing-page/add}" method="post">
                <select name="appointmentId" required>
                    <option value="">-- Select Appointment --</option>
                    <option th:each="a : ${appointments}" th:value="${a.id}"
                            th:text="${'#' + a.id + ' - ' + a.patient.name + ' with ' + a.doctor.name}"></option>
                </select><br>
                <input type="number" name="consultationFee" placeholder="Consultation Fee" step="0.01" required>
                <input type="number" name="labCharges" placeholder="Lab Charges" step="0.01" value="0">
                <input type="number" name="pharmacyCharges" placeholder="Pharmacy Charges" step="0.01" value="0"><br>
                <button type="submit">Generate Bill</button>
            </form>
        </div>
        <div class="card">
            <h3>All Bills</h3>
            <table>
                <tr><th>ID</th><th>Appointment</th><th>Consultation</th><th>Lab</th><th>Pharmacy</th><th>Total</th><th>Status</th></tr>
                <tr th:each="b : ${bills}">
                    <td th:text="${b.id}"></td>
                    <td th:text="${b.appointment.patient.name}"></td>
                    <td th:text="${b.consultationFee}"></td>
                    <td th:text="${b.labCharges}"></td>
                    <td th:text="${b.pharmacyCharges}"></td>
                    <td th:text="${b.totalAmount}"></td>
                    <td th:text="${b.paymentStatus}"></td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
